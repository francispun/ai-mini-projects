<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>認中文字</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      color: #fff;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .group-switch {
      display: flex;
      flex-wrap: wrap;
      background: rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 10px;
      gap: 4px;
      justify-content: center;
    }

    .group-btn {
      flex: 1 1 auto;
      min-width: 58px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.8);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 5px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .group-btn.active {
      background: #fff;
      color: #4f46e5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .mode-switch {
      display: flex;
      background: rgba(255,255,255,0.18);
      border-radius: 14px;
      padding: 3px;
      margin-bottom: 12px;
      gap: 3px;
    }

    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.75);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 10px 4px;
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .mode-btn.active {
      background: #fff;
      color: #4f46e5;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    .candy-bar {
      display: none;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      min-height: 42px;
      align-items: center;
    }

    .candy-bar.show {
      display: flex;
    }

    .candy {
      font-size: 2rem;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
      opacity: 0.25;
      filter: grayscale(1);
    }

    .candy.filled {
      opacity: 1;
      filter: none;
      transform: scale(1.15);
    }

    .candy.pop {
      animation: candyPop 0.45s ease;
    }

    @keyframes candyPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.5); }
      100% { transform: scale(1.15); }
    }

    .number-box {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 22px 14px;
      margin-bottom: 14px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.22);
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .number {
      font-size: 3.8rem;
      font-weight: 800;
      color: #4f46e5;
      line-height: 1.15;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      letter-spacing: 0.04em;
    }

    .number.pop {
      transform: scale(1.08);
    }

    .number.hidden {
      visibility: hidden;
    }

    .jyutping {
      font-size: 1.05rem;
      color: #6b7280;
      margin-top: 6px;
      font-weight: 500;
    }

    .options {
      display: none;
      gap: 10px;
      margin-bottom: 12px;
    }

    .options.show {
      display: flex;
    }

    .option-btn {
      flex: 1;
      border: none;
      background: #fff;
      color: #4f46e5;
      font-size: 1.55rem;
      font-weight: 700;
      padding: 16px 4px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
      transition: transform 0.15s, background 0.2s;
      touch-action: manipulation;
      line-height: 1.2;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-btn:active {
      transform: scale(0.95);
    }

    .option-btn.correct {
      background: #22c55e;
      color: #fff;
    }

    .option-btn.wrong {
      background: #ef4444;
      color: #fff;
    }

    .option-btn:disabled {
      opacity: 0.7;
      pointer-events: none;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button.action {
      border: none;
      border-radius: 18px;
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      box-shadow: 0 7px 18px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #fff;
      touch-action: manipulation;
    }

    button.action:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .btn-speak {
      background: linear-gradient(135deg, #f97316, #ea580c);
    }

    .btn-next {
      background: linear-gradient(135deg, #22c55e, #16a34a);
    }

    .status {
      margin-top: 12px;
      font-size: 0.95rem;
      min-height: 24px;
      opacity: 0.95;
    }

    .status.ok { color: #bbf7d0; }
    .status.error { color: #fecaca; }
    .status.big { font-size: 1.1rem; font-weight: 600; }

    .hide { display: none !important; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #fff;
      border-radius: 28px;
      padding: 36px 28px;
      max-width: 320px;
      width: 88%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.show .modal {
      transform: scale(1);
    }

    .modal-emoji {
      font-size: 4rem;
      margin-bottom: 12px;
    }

    .modal h2 {
      color: #4f46e5;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .modal p {
      color: #6b7280;
      font-size: 1.1rem;
      margin-bottom: 24px;
    }

    .modal button {
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(34,197,94,0.35);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>認中文字</h1>

    <div class="group-switch" id="groupSwitch">
      <button class="group-btn active" data-group="family" type="button">家人</button>
      <button class="group-btn" data-group="body" type="button">身體</button>
      <button class="group-btn" data-group="food" type="button">食物</button>
      <button class="group-btn" data-group="menu" type="button">菜單</button>
      <button class="group-btn" data-group="daily" type="button">日常</button>
      <button class="group-btn" data-group="all" type="button">全部</button>
    </div>

    <div class="mode-switch">
      <button class="mode-btn active" data-mode="seq" type="button">順序</button>
      <button class="mode-btn" data-mode="rand" type="button">隨機</button>
      <button class="mode-btn" data-mode="challenge" type="button">挑戰</button>
    </div>

    <div class="candy-bar" id="candyBar">
      <span class="candy" data-i="0">⭐</span>
      <span class="candy" data-i="1">⭐</span>
      <span class="candy" data-i="2">⭐</span>
      <span class="candy" data-i="3">⭐</span>
      <span class="candy" data-i="4">⭐</span>
    </div>

    <div class="number-box" id="numberBox">
      <div class="number" id="numberDisplay">爸爸</div>
      <div class="jyutping" id="jyutpingDisplay">baa4 baa1</div>
    </div>

    <div class="options" id="options">
      <button class="option-btn" id="opt0" type="button">爸爸</button>
      <button class="option-btn" id="opt1" type="button">媽媽</button>
      <button class="option-btn" id="opt2" type="button">哥哥</button>
    </div>

    <div class="btn-group">
      <button class="action btn-speak" id="speakBtn" type="button">
        <span>🔊</span>
        <span id="speakLabel">講出嚟</span>
      </button>
      <button class="action btn-next" id="nextBtn" type="button">
        <span id="nextIcon">➡️</span>
        <span id="nextLabel">下一個</span>
      </button>
    </div>

    <div class="status" id="status">撳「講出嚟」聽廣東話</div>
  </div>

  <div class="modal-overlay" id="congratsModal">
    <div class="modal">
      <div class="modal-emoji">🎉⭐🎉</div>
      <h2>全部集齊！</h2>
      <p>好叻呀！完成喇！</p>
      <button id="modalCloseBtn" type="button">太棒了！</button>
    </div>
  </div>

  <script>
    // 30 basic Traditional Chinese words for young children
    // Grouped thematically + full set
    const GROUPS = {
      family: [
        { text: "爸爸", jyutping: "baa4 baa1" },
        { text: "媽媽", jyutping: "maa4 maa1" },
        { text: "哥哥", jyutping: "go1 go1" },
        { text: "姐姐", jyutping: "ze2 ze2" },
        { text: "弟弟", jyutping: "dai6 dai2" },
        { text: "妹妹", jyutping: "mui6 mui2" },
        { text: "爺爺", jyutping: "je4 je2" },
        { text: "嫲嫲", jyutping: "maa4 maa4" }
      ],
      body: [
        { text: "頭", jyutping: "tau4" },
        { text: "眼", jyutping: "ngaan5" },
        { text: "耳", jyutping: "ji5" },
        { text: "鼻", jyutping: "bei6" },
        { text: "口", jyutping: "hau2" },
        { text: "手", jyutping: "sau2" },
        { text: "腳", jyutping: "goek3" }
      ],
      food: [
        { text: "水", jyutping: "seoi2" },
        { text: "奶", jyutping: "naai5" },
        { text: "蘋果", jyutping: "ping4 gwo2" },
        { text: "香蕉", jyutping: "hoeng1 ziu1" },
        { text: "魚", jyutping: "jyu4" },
        { text: "菜", jyutping: "coi3" },
        { text: "糖", jyutping: "tong4" },
        { text: "餅", jyutping: "beng2" }
      ],
      menu: [
        { text: "雞", jyutping: "gai1" },
        { text: "牛", jyutping: "ngau4" },
        { text: "羊", jyutping: "joeng4" },
        { text: "豬", jyutping: "zyu1" },
        { text: "飯", jyutping: "faan6" },
        { text: "麵", jyutping: "min6" },
        { text: "湯", jyutping: "tong1" },
        { text: "蛋", jyutping: "daan2" }
      ],
      daily: [
        { text: "狗", jyutping: "gau2" },
        { text: "貓", jyutping: "maau1" },
        { text: "鳥", jyutping: "niu5" },
        { text: "車", jyutping: "ce1" },
        { text: "書", jyutping: "syu1" },
        { text: "床", jyutping: "cong4" },
        { text: "球", jyutping: "kau4" }
      ]
    };

    // Full set
    GROUPS.all = [
      ...GROUPS.family,
      ...GROUPS.body,
      ...GROUPS.food,
      ...GROUPS.menu,
      ...GROUPS.daily
    ];

    let currentGroup = "family";
    let words = GROUPS[currentGroup];
    let currentIndex = 0;
    let currentWord = words[0];
    let mode = "seq";
    let candyCount = 0;
    let waitingAnswer = false;
    let wrongOnce = false;
    const SPEAK_DELAY = 700;
    const MAX_CANDY = 5;

    const numberDisplay = document.getElementById("numberDisplay");
    const jyutpingDisplay = document.getElementById("jyutpingDisplay");
    const optionsEl = document.getElementById("options");
    const candyBar = document.getElementById("candyBar");
    const speakBtn = document.getElementById("speakBtn");
    const nextBtn = document.getElementById("nextBtn");
    const speakLabel = document.getElementById("speakLabel");
    const nextLabel = document.getElementById("nextLabel");
    const nextIcon = document.getElementById("nextIcon");
    const statusEl = document.getElementById("status");
    const candyEls = document.querySelectorAll(".candy");
    const optBtns = [
      document.getElementById("opt0"),
      document.getElementById("opt1"),
      document.getElementById("opt2")
    ];

    let audioCtx = null;

    function setStatus(msg, type = "") {
      statusEl.textContent = msg;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function updateCandies(animateIndex = -1) {
      candyEls.forEach((el, i) => {
        el.classList.remove("pop");
        if (i < candyCount) {
          el.classList.add("filled");
          if (i === animateIndex) {
            void el.offsetWidth;
            el.classList.add("pop");
          }
        } else {
          el.classList.remove("filled");
        }
      });
    }

    function addCandy() {
      if (candyCount < MAX_CANDY) {
        candyCount++;
        updateCandies(candyCount - 1);
        if (candyCount >= MAX_CANDY) {
          setTimeout(() => {
            setStatus("🎉 全部集齊！好叻呀！完成喇！", "ok");
            playSuccessSound();
            optBtns.forEach(b => b.disabled = true);
            nextBtn.disabled = false;
            nextBtn.style.opacity = "1";
            nextLabel.textContent = "重新開始";
            nextIcon.textContent = "🔄";
            document.getElementById("congratsModal").classList.add("show");
          }, 400);
        }
      } else {
        updateCandies();
      }
    }

    function updateDisplay(showWord = true) {
      numberDisplay.textContent = currentWord.text;
      jyutpingDisplay.textContent = currentWord.jyutping;

      // Slightly smaller font for longer words
      if (currentWord.text.length >= 2) {
        numberDisplay.style.fontSize = "3.4rem";
      } else {
        numberDisplay.style.fontSize = "4.2rem";
      }

      if (showWord) {
        numberDisplay.classList.remove("hidden");
        jyutpingDisplay.style.visibility = "visible";
      } else {
        numberDisplay.classList.add("hidden");
        jyutpingDisplay.style.visibility = "hidden";
      }

      numberDisplay.classList.remove("pop");
      void numberDisplay.offsetWidth;
      numberDisplay.classList.add("pop");
    }

    function unlockSpeech() {
      return new Promise(resolve => {
        if (!window.speechSynthesis) return resolve(false);
        try {
          const u = new SpeechSynthesisUtterance(" ");
          u.volume = 0.01;
          u.rate = 2;
          u.onend = u.onerror = () => resolve(true);
          speechSynthesis.speak(u);
          setTimeout(() => resolve(true), 200);
        } catch (e) {
          resolve(false);
        }
      });
    }

    function getVoice() {
      const voices = speechSynthesis.getVoices() || [];
      return (
        voices.find(v => v.lang === "zh-HK" || v.lang === "yue-HK") ||
        voices.find(v => /cantonese|yue|香港|hk/i.test(v.name || "")) ||
        voices.find(v => v.lang.startsWith("zh")) ||
        null
      );
    }

    async function speakWord(wordObj = currentWord) {
      if (!window.speechSynthesis) {
        setStatus("呢部電話唔支援語音", "error");
        return;
      }

      speechSynthesis.cancel();
      if (speechSynthesis.paused) speechSynthesis.resume();

      const u = new SpeechSynthesisUtterance(wordObj.text);
      u.lang = "zh-HK";
      u.rate = 0.82;
      u.pitch = 1;
      u.volume = 1;

      const voice = getVoice();
      if (voice) {
        u.voice = voice;
        u.lang = voice.lang;
      }

      u.onstart = () => setStatus("講緊：「" + wordObj.text + "」", "ok");
      u.onend = () => {
        if (mode !== "challenge" || !waitingAnswer) {
          setStatus("撳「講出嚟」再聽一次");
        }
      };
      u.onerror = () => setStatus("語音失敗，再試一次", "error");

      await unlockSpeech();
      speechSynthesis.speak(u);
    }

    function setGroup(newGroup) {
      currentGroup = newGroup;
      words = GROUPS[currentGroup];
      currentIndex = 0;
      currentWord = words[0];
      candyCount = 0;
      updateCandies();

      document.querySelectorAll(".group-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.group === currentGroup);
      });

      waitingAnswer = false;
      wrongOnce = false;
      optionsEl.classList.remove("show");
      speakBtn.classList.remove("hide");
      nextBtn.classList.remove("hide");

      if (mode === "challenge") {
        candyBar.classList.add("show");
        nextLabel.textContent = "下一題";
        nextIcon.textContent = "▶️";
        nextBtn.disabled = false;
        nextBtn.style.opacity = "1";
        speakLabel.textContent = "再聽一次";
        startChallengeRound();
      } else {
        candyBar.classList.remove("show");
        if (mode === "seq") {
          nextLabel.textContent = "下一個";
          nextIcon.textContent = "➡️";
          speakLabel.textContent = "講出嚟";
          updateDisplay(true);
          setStatus("順序模式：自動讀音");
        } else {
          nextLabel.textContent = "換一個";
          nextIcon.textContent = "🎲";
          speakLabel.textContent = "講出嚟";
          updateDisplay(true);
          setStatus("隨機模式：自己撳先讀");
        }
      }
    }

    function setMode(newMode) {
      mode = newMode;
      waitingAnswer = false;
      wrongOnce = false;
      candyCount = 0;
      updateCandies();

      document.querySelectorAll(".mode-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.mode === mode);
      });

      optionsEl.classList.remove("show");
      speakBtn.classList.remove("hide");
      nextBtn.classList.remove("hide");

      if (mode === "challenge") {
        candyBar.classList.add("show");
        nextLabel.textContent = "下一題";
        nextIcon.textContent = "▶️";
        nextBtn.disabled = false;
        nextBtn.style.opacity = "1";
        speakLabel.textContent = "再聽一次";
        startChallengeRound();
      } else {
        candyBar.classList.remove("show");
        if (mode === "seq") {
          currentIndex = 0;
          currentWord = words[0];
          nextLabel.textContent = "下一個";
          nextIcon.textContent = "➡️";
          speakLabel.textContent = "講出嚟";
          updateDisplay(true);
          setStatus("順序模式：自動讀音");
        } else {
          nextLabel.textContent = "換一個";
          nextIcon.textContent = "🎲";
          speakLabel.textContent = "講出嚟";
          updateDisplay(true);
          setStatus("隨機模式：自己撳先讀");
        }
      }
    }

    function startChallengeRound() {
      waitingAnswer = true;
      wrongOnce = false;
      currentIndex = Math.floor(Math.random() * words.length);
      currentWord = words[currentIndex];
      updateDisplay(false);

      let opts = [currentWord];
      while (opts.length < 3) {
        const candidate = words[Math.floor(Math.random() * words.length)];
        if (!opts.some(o => o.text === candidate.text)) {
          opts.push(candidate);
        }
      }
      opts = opts.sort(() => Math.random() - 0.5);

      optBtns.forEach((btn, i) => {
        btn.textContent = opts[i].text;
        btn.disabled = false;
        btn.classList.remove("correct", "wrong");
        btn.onclick = () => checkAnswer(opts[i], btn);
      });

      optionsEl.classList.add("show");
      setStatus("聽完聲音，揀正確字詞", "big");
      setTimeout(() => speakWord(currentWord), 400);
    }

    function playSuccessSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        const notes = [
          { freq: 523.25, start: 0.00, dur: 0.12 },
          { freq: 659.25, start: 0.10, dur: 0.12 },
          { freq: 783.99, start: 0.20, dur: 0.12 },
          { freq: 1046.5, start: 0.30, dur: 0.25 },
          { freq: 1318.5, start: 0.42, dur: 0.18 },
          { freq: 1568.0, start: 0.52, dur: 0.22 }
        ];
        notes.forEach(note => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.value = note.freq;
          const t = audioCtx.currentTime + note.start;
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.4, t + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + note.dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + note.dur + 0.03);
        });
      } catch (e) {}
    }

    function checkAnswer(chosen, btn) {
      if (!waitingAnswer) return;

      if (chosen.text === currentWord.text) {
        waitingAnswer = false;
        optBtns.forEach(b => b.disabled = true);
        btn.classList.add("correct");

        if (!wrongOnce) {
          addCandy();
          setStatus("✅ 正確！得到一粒星！", "ok");
        } else {
          setStatus("✅ 正確！下次一次過就得星啦！", "ok");
        }

        numberDisplay.classList.remove("hidden");
        jyutpingDisplay.style.visibility = "visible";
        playSuccessSound();

        if (candyCount < MAX_CANDY) {
          setTimeout(() => {
            if (mode === "challenge") startChallengeRound();
          }, 1200);
        }
      } else {
        btn.classList.add("wrong");
        btn.disabled = true;

        if (!wrongOnce) {
          wrongOnce = true;
          setStatus("❌ 唔啱，再聽一次再試！", "error");
          setTimeout(() => speakWord(currentWord), 300);
        } else {
          waitingAnswer = false;
          optBtns.forEach(b => b.disabled = true);
          optBtns.forEach(b => {
            if (b.textContent === currentWord.text) {
              b.classList.add("correct");
            }
          });
          setStatus("唔緊要，繼續努力！", "error");
          numberDisplay.classList.remove("hidden");
          jyutpingDisplay.style.visibility = "visible";
        }
      }
    }

    function nextWord() {
      if (mode === "challenge") {
        startChallengeRound();
        return;
      }
      if (mode === "seq") {
        currentIndex = (currentIndex + 1) % words.length;
        currentWord = words[currentIndex];
      } else {
        let n;
        do {
          n = Math.floor(Math.random() * words.length);
        } while (words[n].text === currentWord.text && words.length > 1);
        currentIndex = n;
        currentWord = words[currentIndex];
      }
      updateDisplay(true);
    }

    document.querySelectorAll(".group-btn").forEach(btn => {
      btn.addEventListener("click", () => setGroup(btn.dataset.group));
    });

    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => setMode(btn.dataset.mode));
    });

    speakBtn.addEventListener("click", (e) => {
      e.preventDefault();
      speakWord();
    });

    nextBtn.addEventListener("click", (e) => {
      e.preventDefault();
      if (mode === "challenge") {
        if (nextLabel.textContent === "重新開始") {
          candyCount = 0;
          updateCandies();
          nextLabel.textContent = "下一題";
          nextIcon.textContent = "▶️";
          nextBtn.disabled = false;
          nextBtn.style.opacity = "1";
          setStatus("重新開始！加油！");
        }
        startChallengeRound();
      } else {
        nextWord();
        if (mode === "seq") {
          setTimeout(() => speakWord(), SPEAK_DELAY);
        } else {
          setStatus("睇清楚，然後撳「講出嚟」");
        }
      }
    });

    if (window.speechSynthesis) {
      speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    document.getElementById("modalCloseBtn").addEventListener("click", () => {
      document.getElementById("congratsModal").classList.remove("show");
    });

    updateDisplay(true);
    updateCandies();
    setStatus("撳「講出嚟」聽廣東話");
  </script>
</body>
</html>
