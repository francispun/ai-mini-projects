<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>認數字 0-9</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .number-box {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 28px;
      padding: 36px 20px;
      margin-bottom: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .number {
      font-size: 8.5rem;
      font-weight: 800;
      color: #4f46e5;
      line-height: 1;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }

    .number.pop {
      transform: scale(1.12);
    }

    .jyutping {
      font-size: 1.35rem;
      color: #6b7280;
      margin-top: 10px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 18px 24px;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .btn-speak {
      background: linear-gradient(135deg, #f97316, #ea580c);
    }

    .btn-next {
      background: linear-gradient(135deg, #22c55e, #16a34a);
    }

    .icon {
      font-size: 1.5rem;
    }

    .status {
      margin-top: 18px;
      font-size: 0.95rem;
      min-height: 24px;
      opacity: 0.85;
    }

    .status.error {
      color: #fecaca;
    }

    .status.ok {
      color: #bbf7d0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>認數字 0–9</h1>

    <div class="number-box">
      <div class="number" id="numberDisplay">0</div>
      <div class="jyutping" id="jyutpingDisplay">ling4</div>
    </div>

    <div class="btn-group">
      <button class="btn-speak" id="speakBtn" type="button">
        <span class="icon">🔊</span>
        <span>講出嚟</span>
      </button>
      <button class="btn-next" id="nextBtn" type="button">
        <span class="icon">🎲</span>
        <span>換一個</span>
      </button>
    </div>

    <div class="status" id="status">撳「講出嚟」聽廣東話</div>
  </div>

  <script>
    const numbers = {
      0: { jyutping: "ling4", text: "零" },
      1: { jyutping: "jat1", text: "一" },
      2: { jyutping: "ji6",  text: "二" },
      3: { jyutping: "saam1", text: "三" },
      4: { jyutping: "sei3",  text: "四" },
      5: { jyutping: "ng5",   text: "五" },
      6: { jyutping: "luk6",  text: "六" },
      7: { jyutping: "cat1",  text: "七" },
      8: { jyutping: "baat3", text: "八" },
      9: { jyutping: "gau2",  text: "九" }
    };

    let currentNum = 0;
    let voicesReady = false;

    const numberDisplay = document.getElementById("numberDisplay");
    const jyutpingDisplay = document.getElementById("jyutpingDisplay");
    const speakBtn = document.getElementById("speakBtn");
    const nextBtn = document.getElementById("nextBtn");
    const statusEl = document.getElementById("status");

    function setStatus(msg, type = "") {
      statusEl.textContent = msg;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function pickRandom() {
      let newNum;
      do {
        newNum = Math.floor(Math.random() * 10);
      } while (newNum === currentNum);
      currentNum = newNum;
      updateDisplay();
    }

    function updateDisplay() {
      const info = numbers[currentNum];
      numberDisplay.textContent = currentNum;
      jyutpingDisplay.textContent = info.jyutping;

      numberDisplay.classList.remove("pop");
      void numberDisplay.offsetWidth;
      numberDisplay.classList.add("pop");
    }

    // iOS 需要先「unlock」語音
    function unlockSpeech() {
      return new Promise((resolve) => {
        if (!window.speechSynthesis) {
          resolve(false);
          return;
        }
        // 講一句空白 / 極短語音來解鎖
        const unlock = new SpeechSynthesisUtterance("");
        unlock.volume = 0;
        unlock.rate = 10;
        unlock.onend = () => resolve(true);
        unlock.onerror = () => resolve(true);
        window.speechSynthesis.speak(unlock);
        // 保險 timeout
        setTimeout(() => resolve(true), 300);
      });
    }

    function getBestVoice() {
      const voices = window.speechSynthesis.getVoices() || [];
      // 優先順序
      const preferred = voices.find(v =>
        v.lang === "zh-HK" ||
        v.lang === "yue-HK" ||
        v.lang === "zh-HK-x-lzh-local" ||
        (v.name && /cantonese|yue|香港|hk/i.test(v.name))
      );
      if (preferred) return preferred;

      // 其次普通話
      const mandarin = voices.find(v =>
        v.lang === "zh-CN" || v.lang === "zh-TW" || v.lang.startsWith("zh")
      );
      return mandarin || null;
    }

    async function speakNumber() {
      if (!window.speechSynthesis) {
        setStatus("呢部電話唔支援語音", "error");
        return;
      }

      // 停止之前
      window.speechSynthesis.cancel();

      // iOS 有時需要 resume
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }

      const info = numbers[currentNum];
      const utterance = new SpeechSynthesisUtterance(info.text);

      utterance.lang = "zh-HK";
      utterance.rate = 0.8;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;

      const voice = getBestVoice();
      if (voice) {
        utterance.voice = voice;
        utterance.lang = voice.lang;
      }

      utterance.onstart = () => {
        setStatus("講緊：「" + info.text + "」", "ok");
      };

      utterance.onend = () => {
        setStatus("撳「講出嚟」再聽一次");
      };

      utterance.onerror = (e) => {
        console.error("Speech error:", e);
        setStatus("語音出錯，再試一次", "error");
      };

      // 再解鎖一次（特別係 iOS）
      await unlockSpeech();
      window.speechSynthesis.speak(utterance);
    }

    // 載入 voices
    function loadVoices() {
      const voices = window.speechSynthesis.getVoices();
      if (voices.length > 0) {
        voicesReady = true;
      }
    }

    if (window.speechSynthesis) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // 按鈕事件（用 pointerup 更穩陣）
    speakBtn.addEventListener("click", function (e) {
      e.preventDefault();
      speakNumber();
    });

    nextBtn.addEventListener("click", function (e) {
      e.preventDefault();
      pickRandom();
      // 換完稍停再講
      setTimeout(() => {
        speakNumber();
      }, 350);
    });

    // 初始
    updateDisplay();
    setStatus("撳「講出嚟」聽廣東話");
  </script>
</body>
</html>
